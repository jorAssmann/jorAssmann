[project]
name = "github-koi"
version = "0.2.0"
description = "Ein Koi fürs GitHub-Profil, der mit regelmäßiger Aktivität wächst und in den Farben der aktuellen Programmiersprachen gefleckt ist."
readme = "README.md"
requires-python = ">=3.12"
# Bewusst leer: Der nächtliche Workflow ruft nur `python3` auf und installiert nichts.
# Deshalb nur Standardbibliothek (urllib statt httpx, dataclasses statt Pydantic).
dependencies = []

[project.scripts]
koi-profil = "koi_profil.__main__:main"

[dependency-groups]
# Prüfwerkzeuge: dieselben Versionen lokal und in CI (uv.lock).
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "koi_profil"

[tool.ruff]
# Etwas länger als der Standard (88), weil deutsche Kommentare längere Wörter haben.
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes: Grundfehler
    "I",            # Importe sortiert
    "B",            # bugbear: typische Fehlerquellen
    "UP",           # pyupgrade: Syntax für die eingestellte Python-Version
    "SIM", "C4",    # Vereinfachungen
    "PTH",          # pathlib statt os.path
    "N",            # Namenskonventionen
    "ANN",          # Type Hints an Funktionen
    "D",            # Docstrings
    "S",            # bandit: Sicherheitsprobleme
    "RUF",          # ruff-eigene Regeln
]
ignore = [
    # Deutsche Typografie („…“, –) gilt sonst als verwechselbares Zeichen.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: assert ist dort richtig, Docstrings und Rückgabetypen wären Lärm.
# S318: Tests parsen nur das selbst erzeugte SVG. S311: Zufall nur für Formen, nicht Sicherheit.
"tests/**" = ["S101", "D", "ANN", "S318", "S311"]
# random dient nur der Optik (Fleckenlage, Schwimmroute, Demo-Kalender), nicht der Sicherheit.
"src/koi_profil/{render,demo,swim}.py" = ["S311"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
# Viele Bibliotheken liefern keine Typ-Stubs; das ist kein Fehler im eigenen Code.
reportMissingTypeStubs = false

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true
